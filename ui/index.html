<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch-Lernprogramm</title>
<style>
  :root {
    --paper: #f2f6fb;
    --grid: #cfdbea;
    --ink: #1c3fb8;
    --graphite: #262a33;
    --pen: #d62839;
    --marker: #f6cf3c;
    --cell: 28px;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--graphite);
    font: 18px/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    background-position: -1px -1px;
  }
  /* Rand wie im Schulheft: red margin line */
  body::before {
    content: ""; position: fixed; inset: 0 auto 0 calc(var(--cell) * 2 - 1px);
    width: 2px; background: var(--pen); opacity: .55; pointer-events: none;
  }
  main { max-width: 46rem; margin: 0 auto; padding: calc(var(--cell) * 2) 1.25rem calc(var(--cell) * 3) 4.5rem; }
  h1, h2, .hand {
    font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Marker Felt", cursive;
    color: var(--ink); font-weight: 400; letter-spacing: .01em;
  }
  h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.1; margin: 0 0 var(--cell); }
  h2 { font-size: 1.5rem; margin: 0 0 var(--cell); line-height: var(--cell); }
  p { margin: 0 0 var(--cell); }

  .menu { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .menu button {
    width: 100%; text-align: left; padding: .7rem 1rem; background: var(--paper);
    border: 2px solid var(--graphite); border-radius: 3px 14px 4px 12px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    transition: transform .12s, box-shadow .12s;
  }
  .menu button:hover { transform: translate(-2px,-2px); box-shadow: 4px 4px 0 var(--ink); }
  .menu small { color: #5b6272; font-size: .9rem; }
  .menu .hand { font-size: 1.35rem; }

  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .back { background: none; border: 0; padding: 0; margin-bottom: var(--cell); color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

  .prompt { font-size: clamp(1.4rem, 4.5vw, 2rem); line-height: calc(var(--cell) * 1.5); margin: 0 0 var(--cell); }
  .prefix { background: linear-gradient(transparent 55%, var(--marker) 55% 92%, transparent 92%); }
  .sep { color: var(--pen); }
  .answer {
    min-height: calc(var(--cell) * 3); margin: 0 0 var(--cell);
    font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Marker Felt", cursive;
    color: var(--ink); font-size: clamp(1.25rem, 4vw, 1.7rem); line-height: calc(var(--cell) * 1.5);
  }
  .answer[hidden] { display: block; visibility: hidden; }
  .answer:not([hidden]) { animation: write .5s steps(24) both; }
  .answer .note { display: block; color: var(--graphite); font-family: inherit; font-size: 1rem; margin-top: .25rem; }
  .answer .note b { color: var(--pen); font-weight: 400; }
  @keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .actions button {
    padding: .5rem 1rem; background: var(--paper); border: 2px solid var(--graphite);
    border-radius: 3px 12px 3px 12px;
  }
  .actions button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  kbd { font: inherit; font-size: .85em; border-bottom: 2px solid currentColor; padding: 0 .15em; margin-left: .35em; opacity: .8; }
  .err { color: var(--pen); }
  @media (max-width: 520px) {
    body::before { left: 30px; } main { padding-left: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .answer:not([hidden]) { animation: none; }
    .menu button { transition: none; }
  }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const app = document.getElementById('app');
const files = {
  sentences: '../data/sentences.tsv',
  separable: '../data/separable-verbs.tsv',
  inseparable: '../data/inseparable-verbs.tsv',
};
const data = {};
let view = 'menu', current = null, revealed = false;

const el = (html) => { app.innerHTML = html; };
const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick = (a) => a[Math.floor(Math.random() * a.length)];

async function load(kind) {
  if (data[kind]) return data[kind];
  const res = await fetch(files[kind]);
  if (!res.ok) throw new Error(files[kind]);
  const rows = (await res.text()).split('\n')
    .filter(l => l.trim() && !l.startsWith('#'))
    .map(l => l.split('\t'));
  // Some verb files carry a leading row number; drop it.
  data[kind] = kind === 'sentences'
    ? rows.filter(r => r.length >= 2)
    : rows.map(r => /^\d+$/.test(r[0]) ? r.slice(1) : r).filter(r => r.length >= 2);
  return data[kind];
}

function menu() {
  view = 'menu';
  el(`<h1>Deutsch lernen</h1>
  <p>Wähle eine Übung.</p>
  <ul class="menu">
    <li><button data-go="sentences"><span class="hand">Sätze übersetzen</span><small>Taste 1</small></button></li>
    <li><button data-go="separable"><span class="hand">Trennbare Verben</span><small>Taste 2</small></button></li>
    <li><button data-go="inseparable"><span class="hand">Untrennbare Verben</span><small>Taste 3</small></button></li>
  </ul>`);
  app.querySelector('button').focus();
}

// Prefix list for highlighting the verb prefix.
const PREFIXES = ['zurück','zusammen','vorbei','weiter','heraus','herein','hinaus','hinein','fest','statt','teil','weg','auf','aus','an','ab','bei','ein','mit','nach','vor','zu','um','durch','über','unter','wieder','be','emp','ent','er','ge','miss','ver','zer'];
function splitPrefix(verb) {
  const p = PREFIXES.filter(x => verb.startsWith(x) && verb.length > x.length + 2)
                    .sort((a, b) => b.length - a.length)[0];
  return p ? `<span class="prefix">${esc(p)}</span>${esc(verb.slice(p.length))}` : esc(verb);
}

async function practice(kind) {
  view = kind; revealed = false;
  let items;
  try { items = await load(kind); }
  catch (e) { el(`<button class="back" data-go="menu">Hauptmenü</button><p class="err">Datei nicht gefunden: ${esc(String(e.message))}. Starte die Oberfläche mit ./german-ui.sh.</p>`); return; }
  current = pick(items);
  render(kind);
}

function render(kind) {
  const back = `<button class="back" data-go="menu">← Hauptmenü <kbd>m</kbd></button>`;
  if (kind === 'sentences') {
    const [en, de] = current;
    el(`${back}<h2>Übersetze ins Deutsche</h2>
      <p class="prompt">${esc(en)}</p>
      <div class="answer" ${revealed ? '' : 'hidden'}>${esc(de)}</div>
      <div class="actions">
        <button data-act="reveal" class="${revealed ? '' : 'primary'}">Übersetzung zeigen<kbd>t</kbd></button>
        <button data-act="next" class="${revealed ? 'primary' : ''}">Nächster Satz<kbd>n</kbd></button>
      </div>`);
  } else {
    const [verb, meaning, example = ''] = current;
    const title = kind === 'separable' ? 'Trennbare Verben' : 'Untrennbare Verben';
    el(`${back}<h2>${title}</h2>
      <p class="prompt">${splitPrefix(verb)}</p>
      <div class="answer" ${revealed ? '' : 'hidden'}>${esc(meaning)}
        <span class="note">${esc(example)}</span></div>
      <div class="actions">
        <button data-act="reveal" class="${revealed ? '' : 'primary'}">Bedeutung zeigen<kbd>b</kbd></button>
        <button data-act="next" class="${revealed ? 'primary' : ''}">Nächstes Verb<kbd>n</kbd></button>
      </div>`);
  }
}

function reveal() {
  if (revealed) return;
  revealed = true;
  const a = app.querySelector('.answer');
  a.hidden = false;
  app.querySelector('[data-act=reveal]').classList.remove('primary');
  app.querySelector('[data-act=next]').classList.add('primary');
}

app.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) return b.dataset.go === 'menu' ? menu() : practice(b.dataset.go);
  if (b.dataset.act === 'reveal') reveal();
  if (b.dataset.act === 'next') practice(view);
});

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (view === 'menu') {
    ({ '1': 'sentences', '2': 'separable', '3': 'inseparable' })[k] && practice(({ '1': 'sentences', '2': 'separable', '3': 'inseparable' })[k]);
  } else if (k === 'm') menu();
  else if (k === 'n') practice(view);
  else if (k === 't' || k === 'b') reveal();
});

menu();
</script>
</body>
</html>
